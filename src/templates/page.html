<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>$title</title>
    <link rel="canonical" href="$canonical" />
    <link rel="apple-touch-icon" sizes="180x180" href="$asset_prefix/images/favicon_io/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="$asset_prefix/images/favicon_io/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="$asset_prefix/images/favicon_io/favicon-16x16.png" />
    <link rel="icon" href="$asset_prefix/images/favicon_io/favicon.ico" sizes="any" />
    <link rel="manifest" href="$asset_prefix/images/favicon_io/site.webmanifest" />
    <link rel="stylesheet" href="$asset_prefix/assets/site.css" />
    <meta name="description" content="$description" />
  </head>
  <body class="$page_class">
    <header class="site-header">
      <div class="brand">
        <a href="$asset_prefix/" class="brand-link">$site_title</a>
      </div>
$header_right
    </header>

    <main class="site-main">
$content
    </main>

    <script src="$asset_prefix/assets/site.js" defer></script>
$page_script
  </body>
</html>
